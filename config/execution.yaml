# Free mode toggle: set to true for Gemini Free Tier (rate-limited operation).
# When enabled, roles from free_mode_roles in roles.yaml are used,
# and Gemini API rate limits (RPM/TPM/RPD) are automatically respected.
free_mode: false

# HTTP request/timeout tuning.
# request_timeout: base read timeout (s) for any call.
# request_timeout_per_token: extra timeout headroom per requested output token,
# so large responses (base64-encoded generated files) do not time out. Final
# timeout = max(request_timeout, max_tokens * request_timeout_per_token),
# capped at MAX_TIMEOUT_CAP (3600) in core/provider_client.py.
request_timeout: 120
request_timeout_per_token: 0.08

# Per-model rate limits for Gemini Free Tier (applied only when free_mode: true)
rate_limits:
  gemini-3.5-flash:
    rpm: 10
    tpm: 250000
    rpd: 1500
  gemini-3.1-flash-lite:
    rpm: 15
    tpm: 250000
    rpd: 1000
  gemini-3.1-pro-preview:
    rpm: 5
    tpm: 250000
    rpd: 100
  gemini-2.5-pro:
    rpm: 5
    tpm: 250000
    rpd: 100
  gemini-2.5-flash:
    rpm: 10
    tpm: 250000
    rpd: 250
  gemini-2.5-flash-lite:
    rpm: 15
    tpm: 250000
    rpd: 1000
  gemini-2.0-flash:
    rpm: 15
    tpm: 1000000
    rpd: 1500
  gemini-2.0-flash-lite:
    rpm: 30
    tpm: 1000000
    rpd: 1500

# Execution loop caps
max_phases: 10
max_retries_per_phase: 3
max_total_calls: 25
max_file_size_chars: 50000
max_tokens_execution: 50000